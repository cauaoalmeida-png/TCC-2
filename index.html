<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - FactoryTrack</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/header.css">
  <link rel="stylesheet" href="css/footer.css">
  <link rel="stylesheet" href="css/login.css">
</head>
<body>

<header class="header">
  <div class="container">
    <div class="logo">
      <a href="pages/Inicio.html"><i class="fas fa-industry"></i><span>FactoryTrack</span></a>
    </div>
    <button class="menu-toggle" id="menuToggle"><span></span><span></span><span></span></button>
  </div>
</header>

<!-- index.html (Trecho atualizado) -->

<main class="login-page">
  <div class="login-container"> <!-- Novo container para centralização total -->
    <div class="login-card">
      <h1><i class="fas fa-lock"></i> Login</h1>
      <p>Acesse o FactoryTrack com seu usuário e senha.</p>

      <form id="form-login">
        <div class="form-group">
          <label for="nomeInput">Nome</label>
          <div class="input-icon-wrapper"> <!-- Novo wrapper para ícone + input -->
            <i class="fas fa-user"></i> <!-- Ícone de Usuário -->
            <input id="nomeInput" type="text" placeholder="Seu nome" required />
          </div>
        </div>
        
        <div class="form-group">
          <label for="senhaInput">Senha</label>
          <div class="input-icon-wrapper"> <!-- Novo wrapper para ícone + input -->
            <i class="fas fa-key"></i> <!-- Ícone de Chave/Senha -->
            <input id="senhaInput" type="password" placeholder="Sua senha" required />
          </div>
        </div>

        <div class="login-actions">
          <button type="button" class="btn btn-primary" onclick="fazerLogin()">
            <i class="fas fa-right-to-bracket"></i> Entrar
          </button>
        </div>
      </form>

      <div class="error" id="errorBox"></div>
      <div class="user-badge" id="sessionInfo" style="display:none"></div>
    </div>
  </div>
</main>

<footer class="footer">
  <div class="container">
    <div class="footer-content">
      <div class="footer-section">
        <h4>FactoryTrack</h4>
        <ul>
          <li><a href="pages/Inicio.html">Início</a></li>
        </ul>
      </div>
    </div>
    <div class="footer-bottom">
      <p>FactoryTrack — Eficiência começa com informação.</p>
      <p>© 2025 FactoryTrack</p>
    </div>
  </div>
</footer>

<script src="js/config.js"></script>
<script src="js/auth.js"></script>
<script>
  function redirecionar(path) {
    window.location.href = path;
  }

  function setError(msg) {
    const el = document.getElementById('errorBox');
    el.textContent = msg;
    el.style.display = 'block';
  }

  function fazerLogin() {
    const nome = document.getElementById('nomeInput').value.trim();
    const senha = document.getElementById('senhaInput').value;
    if (!nome || !senha) {
      setError('Informe nome e senha.');
      return;
    }

    // Tenta autenticar no localStorage
    const res = loginUsuario(nome, senha);
    if (!res.ok) {
      setError(res.msg || 'Login inválido.');
      return;
    }

    const sess = getSessao();
    document.getElementById('sessionInfo').style.display = 'block';
    document.getElementById('sessionInfo').textContent = `Sessão ativa: ${sess.nome} (${cargoLabel(sess.cargo)})`;

    let next = null;
    try { next = sessionStorage.getItem('ft_next_url'); } catch (e) {}
    try { sessionStorage.removeItem('ft_next_url'); } catch (e) {}

    if (next) {
      window.location.href = next;
      return;
    }

    redirecionar('pages/Inicio.html');
  }

  // Garante que os usuários padrão existam na memória sem precisar do botão Demo
  function garantirUsuariosDemo() {
    if (!temUsuarios()) {
      registrarUsuario('operador', '123', 'operador');
      registrarUsuario('gerente', '123', 'gerente');
      registrarUsuario('chefe', '123', 'chefe_geral');
    }
  }

  document.addEventListener('DOMContentLoaded', () => {
    // Executa automaticamente ao abrir a página
    garantirUsuariosDemo();

    const sess = getSessao();
    if (sess) {
      document.getElementById('sessionInfo').style.display = 'block';
      document.getElementById('sessionInfo').textContent = `Sessão ativa: ${sess.nome} (${cargoLabel(sess.cargo)})`;
      redirecionar('pages/Inicio.html');
    }
  });
</script>
</body>
</html>
